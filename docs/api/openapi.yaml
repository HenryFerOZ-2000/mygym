components:
  schemas:
    Allocation:
      type: object
      properties:
        charge_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - amount
      - charge_id
    AttendancePage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: integer
          nullable: true
        previous:
          type: integer
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRead'
      required:
      - count
      - next
      - previous
      - results
    AttendancePreview:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
        full_name:
          type: string
        status:
          type: string
        membership_id:
          type: string
          format: uuid
          nullable: true
        last_day:
          type: string
          format: date
          nullable: true
        previous_last_day:
          type: string
          format: date
          nullable: true
        next_start:
          type: string
          format: date
          nullable: true
        local_date:
          type: string
          format: date
        today_count:
          type: integer
        timezone:
          type: string
      required:
      - client_id
      - full_name
      - last_day
      - local_date
      - membership_id
      - next_start
      - previous_last_day
      - status
      - timezone
      - today_count
    AttendanceRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        full_name:
          type: string
        actor:
          type: string
        created_at:
          type: string
          format: date-time
        local_date:
          type: string
          format: date
        timezone:
          type: string
        decision:
          type: string
        service_status:
          type: string
        reason:
          type: string
        voided:
          type: boolean
        void_reason:
          type: string
          nullable: true
        void_actor:
          type: string
          nullable: true
        voided_at:
          type: string
          format: date-time
          nullable: true
      required:
      - actor
      - client_id
      - created_at
      - decision
      - full_name
      - id
      - local_date
      - reason
      - service_status
      - timezone
      - void_actor
      - void_reason
      - voided
      - voided_at
    AttendanceReport:
      type: object
      properties:
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
        as_of:
          type: string
          format: date-time
        entries:
          type: integer
        clients:
          type: integer
        exceptions:
          type: integer
        voided:
          type: integer
      required:
      - as_of
      - clients
      - entries
      - exceptions
      - from_date
      - to_date
      - voided
    AttendanceWrite:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        expected_date:
          type: string
          format: date
        expected_count:
          type: integer
          minimum: 0
        confirm_repeat:
          type: boolean
          default: false
        exception:
          type: boolean
          default: false
        reason:
          type: string
          default: ''
          maxLength: 300
      required:
      - expected_count
      - expected_date
      - request_id
    Cancel:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 300
        effective_date:
          type: string
          format: date
      required:
      - effective_date
      - reason
      - request_id
    Change:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 300
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - reason
      - request_id
      - start_date
    ChargePage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: integer
          nullable: true
        previous:
          type: integer
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ChargeRead'
      required:
      - count
      - next
      - previous
      - results
    ChargeRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          format: uuid
        label:
          type: string
        amount:
          type: string
        balance:
          type: string
        currency:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - amount
      - balance
      - created_at
      - currency
      - id
      - label
      - source
    ClientPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ClientRead'
      required:
      - count
      - next
      - previous
      - results
    ClientRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - is_active
      - phone
      - updated_at
    ClientWrite:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        is_active:
          type: boolean
      required:
      - full_name
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CurrencyReport:
      type: object
      properties:
        currency:
          type: string
        payments:
          type: string
          format: decimal
          pattern: ^-?\d{0,22}(?:\.\d{0,2})?$
        refunds:
          type: string
          format: decimal
          pattern: ^-?\d{0,22}(?:\.\d{0,2})?$
        net:
          type: string
          format: decimal
          pattern: ^-?\d{0,22}(?:\.\d{0,2})?$
        outstanding_now:
          type: string
          format: decimal
          pattern: ^-?\d{0,22}(?:\.\d{0,2})?$
      required:
      - currency
      - net
      - outstanding_now
      - payments
      - refunds
    Enrollment:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        request_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          minimum: 1
        expected_start:
          type: string
          format: date
        expected_end:
          type: string
          format: date
      required:
      - expected_end
      - expected_start
      - expected_version
      - plan_id
      - request_id
      - start_date
    ExpiryPage:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        reference_date:
          type: string
          format: date
        timezone:
          type: string
        count:
          type: integer
        next:
          type: integer
          nullable: true
        previous:
          type: integer
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExpiryRow'
      required:
      - as_of
      - count
      - next
      - previous
      - reference_date
      - results
      - timezone
    ExpiryRow:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
        full_name:
          type: string
        status:
          type: string
        coverage_end:
          type: string
          format: date
          nullable: true
        previous_end:
          type: string
          format: date
          nullable: true
        next_start:
          type: string
          format: date
          nullable: true
        last_day:
          type: string
          format: date
          nullable: true
        calendar_days_remaining:
          type: integer
          nullable: true
      required:
      - calendar_days_remaining
      - client_id
      - coverage_end
      - full_name
      - last_day
      - next_start
      - previous_end
      - status
    FinancialReport:
      type: object
      properties:
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
        timezone:
          type: string
        as_of:
          type: string
          format: date-time
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyReport'
      required:
      - as_of
      - currencies
      - from_date
      - timezone
      - to_date
    Health:
